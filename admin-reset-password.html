<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Password | Laxmikant Traders</title></head>
<body class="bg-light"><main class="container min-vh-100 d-flex align-items-center justify-content-center py-5"><section class="card border-0 shadow-sm w-100" style="max-width:28rem"><div class="card-body p-4 p-md-5"><h1 class="h3">Reset password</h1><div id="form-message" role="status" aria-live="polite" hidden></div><div id="invalid-reset-link" class="alert alert-warning" role="alert" hidden><p class="mb-3">Invalid or missing reset link. Please request a new password reset link.</p><a class="btn btn-outline-primary" href="/admin-forgot-password.html">Request Reset Link</a></div><form id="reset-password-form" novalidate hidden><p class="text-body-secondary">Use 12–128 characters with upper, lower, number, and symbol. Both passwords must match.</p><label class="form-label" for="new-password">New password</label><input class="form-control mb-3" id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label class="form-label" for="confirm-password">Confirm password</label><input class="form-control mb-3" id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button class="btn btn-primary w-100" type="submit">Reset password</button></form></div></section></main><script type="module" src="/src/admin/pages/reset-password.page.js"></script></body></html>
