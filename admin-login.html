<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Sign In | Laxmikant Traders</title>
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card border-0 shadow-sm" style="max-width: 28rem; width: 100%;" aria-labelledby="login-title">
            <div class="card-body p-4 p-md-5">
                <h1 id="login-title" class="h3 mb-2">Admin sign in</h1>
                <p class="text-body-secondary mb-4">Laxmikant Traders Product Catalogue</p>
                <div id="admin-login-message" class="alert alert-danger" role="status" aria-live="polite" hidden></div>
                <form id="admin-login-form" novalidate>
                    <div class="mb-4">
                        <label class="form-label" for="admin-password">Password</label>
                        <input class="form-control" id="admin-password" name="password" type="password" autocomplete="current-password" required>
                        <div class="invalid-feedback">Enter your password.</div>
                    </div>
                    <button id="admin-login-submit" class="btn btn-primary w-100" type="submit">
                        <span class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                        <span class="button-label">Sign in</span>
                    </button>
                </form>
                <a class="d-block mt-3 text-center" href="/admin-forgot-password.html">Forgot Password?</a>
            </div>
        </section>
    </main>
    <script type="module" src="/src/admin/pages/login.page.js"></script>
</body>
</html>
